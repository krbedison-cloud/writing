<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173c36"><title>申论进阶 · 每一笔，都算数</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/reading.css"><link rel="stylesheet" href="/static/paper.css"><script defer src="/static/paper-layout.js"></script><script defer src="/static/paper-editor.js"></script><script defer src="/static/annotations.js"></script><script defer src="/static/practice-timer.js"></script><script defer src="/static/app.js"></script></head>
<body>
<div class="navigation-drawer" id="navigation-drawer" data-open="false"><button type="button" class="nav-reveal" id="nav-reveal" aria-label="展开导航" aria-controls="navigation" aria-expanded="false">☰<span>导航</span></button><aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">申</span><span>申论进阶<small>SHENLUN STUDIO</small></span></a><div class="sidebar-label">我的学习空间</div><nav id="navigation"></nav><div class="sidebar-bottom"><div class="local-dot"></div><span>你的专属训练场<small>数据保存在本地设备</small></span></div></aside></div>
<div class="workspace"><header class="topbar"><div class="breadcrumb">学习空间 <span>/</span> <b id="crumb">学习概览</b></div><div class="top-tools"><button class="btn small" id="focus-exit" data-action="toggle-focus" hidden>退出专注</button><details class="reading-menu" id="reading-menu"><summary><span class="reading-aa" aria-hidden="true">Aa</span> 阅读设置</summary><div class="reading-popover"><h2>调到眼睛舒服的样子</h2><p>设置用于材料、题干、答案与批改长文，并在当前浏览器记住。</p><label class="field">正文大小<select id="reading-size"><option value="18">18px · 标准</option><option value="20" selected>20px · 舒适（默认）</option><option value="22">22px · 大字</option><option value="24">24px · 特大字</option></select></label><label class="field">行间距<select id="reading-leading"><option value="1.8">1.8 倍 · 紧凑</option><option value="2" selected>2 倍 · 舒展</option><option value="2.2">2.2 倍 · 宽松</option></select></label><label class="field">正文字体<select id="reading-font"><option value="sans">系统黑体 · 清晰</option><option value="serif">宋体 · 纸张阅读感</option></select></label><label class="field">阅读背景<select id="reading-theme"><option value="paper">暖纸</option><option value="light">浅白</option><option value="night">夜读</option></select></label><label class="field">长文布局<select id="reading-layout"><option value="auto">电脑左右对照 · 手机上下</option><option value="stacked">上下阅读 · 更宽的正文</option></select></label><button class="btn small" data-action="reader-reset">恢复默认</button></div></details><span id="activity" class="muted">准备就绪</span><span class="avatar">我</span></div></header><main id="main" tabindex="-1"></main><footer>申论进阶 <span>·</span> 练习有迹，成长有据 <span>·</span> AI 评价仅供训练参考</footer></div>
<div id="material-toolbar" role="dialog" aria-label="材料高亮" hidden><label>颜色 <input type="color" id="highlight-color" value="#ffff00" aria-label="高亮颜色"></label><button class="btn primary small" type="button" data-highlight-save>高亮</button><button class="btn small" type="button" data-highlight-delete hidden>取消高亮</button><button class="btn small" type="button" data-highlight-close aria-label="关闭高亮工具">×</button></div><div id="toast" role="status" aria-live="polite"></div><input type="file" id="pdf-input" accept="application/pdf,.pdf" hidden><dialog id="editor"><div id="editor-content"></div></dialog>
