name: Test and publish Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: for script_path in app/static/*.js; do node --check "$script_path"; done
      - run: node --test tests/test_practice_timer.cjs
      - run: bash -n install.sh
      - run: docker compose -f compose.deploy.yaml config --quiet
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/screenshots/
          retention-days: 7
  publish:
    needs: [test, android]
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export prebuilt Docker images for public release downloads
        run: |
          set -euo pipefail
          mkdir -p release
          version="${{ steps.version.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          for arch in arm64 amd64; do
            docker pull --platform "linux/$arch" "$image"
            docker save --platform "linux/$arch" "$image" | gzip > "release/shenlun-studio-$version-linux-$arch.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: release/*.tar.gz
          compression-level: 0
          retention-days: 7
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "申论进阶 $VERSION" --generate-notes compose.deploy.yaml install.sh release/*.tar.gz
