name: Publish verified signed Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop release tag
        required: true
        type: string
      blob_sha:
        description: Git blob containing the already signed APK
        required: true
        type: string
      apk_sha256:
        description: SHA-256 of the locally verified signed APK
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      APK_BLOB: ${{ inputs.blob_sha }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - name: Retrieve and verify the signed artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APK_BLOB" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null
          gh api "repos/$GH_REPO/git/blobs/$APK_BLOB" --jq .content | base64 --decode > shenlun-companion.apk
          echo "$APK_SHA256  shenlun-companion.apk" > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq shenlun-companion.apk
      - name: Upload the verified APK and checksum
        run: gh release upload "$RELEASE_TAG" shenlun-companion.apk SHA256SUMS --repo "$GH_REPO" --clobber
