services:
  shenlun:
    image: shenlun-studio:local
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - shenlun-data:/data
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TZ: Asia/Shanghai
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  shenlun-data:
