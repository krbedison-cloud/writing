services:
  shenlun:
    image: ${SHENLUN_IMAGE:-ghcr.io/krbedison-cloud/writing:v0.1.15}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-18086}:8000"
    volumes:
      - shenlun-data:/data
    environment:
      ALLOW_LAN: ${ALLOW_LAN:-0}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TZ: Asia/Shanghai
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  shenlun-data:
    name: shenlun-studio-data
